name: CI

# Powod istnienia tego pliku: 2026-09-18 stala `65 tok/s` udajaca pomiar
# przeszla przez kod, komentarz i demo. Sygnal byl widoczny (dwie rozne karty,
# jedna liczba) i zostal przeoczony kilka razy. Recenzent, testy i czlowiek
# zawiodly jednoczesnie — wiec to musi sprawdzac maszyna, przy kazdym pushu.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  testy:
    # Macierz systemow, bo kod tozsamosci (M5.2a) ma galezie per system:
    # sciezka macOS `~/Library/Application Support/SIMON` NIGDY nie byla
    # skompilowana, dopoki CI chodzilo wylacznie na Linuksie. Blad w galezi
    # pod `#[cfg(target_os = "macos")]` jest na Linuksie NIEWIDOCZNY — kompilator
    # jej nawet nie oglada.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Gateway unit tests
        run: python3 -m unittest discover -s tools/simon-api -p "test_*.py"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Testy
        run: cargo test --release --locked

      # Clippy blokuje (od 2026-10-15): wczesniej `continue-on-error` chowal
      # bledy, a README twierdzilo "0 ostrzezen". Wylapal to Joe w PR #3.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    # Narzedzia w Pythonie (gateway, industry, kanarek, monitor): samotesty bez sieci.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gateway failover
        run: python3 tools/simon-api/check_failover.py
      - name: Samotesty narzedzi
        run: |
          for m in "simon-industry rules" "simon-industry tickets" "simon-canary simon_canary" "simon-monitor simon_monitor"; do
            set -- $m
            python3 -c "import sys; sys.path.insert(0, 'tools/$1'); import $2; $2.selfcheck(); print('$2 ok')"
          done

  ui:
    # Strona jest tym, co widza sedziowie: typy, swieze fixtures z przyklady/, build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Fixtures zgodne z przyklady/
        run: npm run fixtures && git diff --exit-code src/lib/fixture.ts
      - run: npm run build
        env:
          BASE_PATH: /SIMON

  wartownik-stalych:
    # Osobne zadanie, zeby bylo widac W NAZWIE, co pilnuje.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Detektor pomiarow-stalych
        run: cargo test --release -p simon-core pomiar -- --nocapture

      # Sygnatura bledu z 2026-09-18: przepustowosc liczona ze stalej.
      # Wartownik celowo pomija komentarze (opis incydentu ma moc zostac
      # w kodzie) i przeliczenia ms->s, a lapie dzielenie przez stala stawke.
      - name: Wartownik stalych
        run: python3 scripts/wartownik_stalych.py crates
