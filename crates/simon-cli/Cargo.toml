[package]
name = "simon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SIMON — binarka: --role agent|coord|node (M1.2)"

[[bin]]
name = "simon"
path = "src/main.rs"

[dependencies]
simon-core = { path = "../simon-core" }
simon-node = { path = "../simon-node" }
simon-harness = { path = "../simon-harness" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
libp2p = { version = "0.57.0", features = ["tokio", "gossipsub", "kad", "identify", "noise", "yamux", "tcp", "quic", "dns", "macros", "ping", "request-response", "cbor"] }
futures = "0.3"
reqwest.workspace = true
