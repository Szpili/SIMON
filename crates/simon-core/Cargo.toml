[package]
name = "simon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SIMON — typy protokołu i receipty (wspólne z DC)"

[dependencies]
ed25519-dalek.workspace = true
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# RNG systemowy (OsRng) jest potrzebny wylacznie na hoscie: Keypair::generate,
# tozsamosc (pliki klucza) i rejestr (I/O). Weryfikacja receiptu go NIE uzywa,
# a na wasm32-unknown-unknown getrandom wymaga JS-glu — dlatego rand jest tu
# zaleznoscia tylko dla nie-wasm. Dzieki temu simon-core kompiluje sie do WASM.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand.workspace = true

[dev-dependencies]
tempfile = "3"
